
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Museo de la Memoria | Recorrido virtual</title>

<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f1eb;
  color: #153a31;
  text-align: center;
}

header {
  padding: 22px 15px;
}

h1 {
  margin: 8px;
  font-size: 28px;
}

.controles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
}

button {
  background: #153a31;
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #286a55;
}

#contenedor {
  position: relative;
  width: 100%;
  height: 65vh;
  min-height: 300px;
  background: #e9eee9;
  overflow: hidden;
}

model-viewer {
  width: 100%;
  height: 100%;
}

#visor-recorrido {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
  touch-action: none;
}

canvas {
  display: block;
  touch-action: none;
}

#instrucciones {
  padding: 15px;
  font-size: 14px;
}

#joystick {
  display: none;
  position: absolute;
  bottom: 25px;
  left: 25px;
  width: 110px;
  height: 110px;
  background: rgba(0,0,0,0.22);
  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 50%;
  touch-action: none;
  z-index: 10;
}

#palanca {
  position: absolute;
  width: 44px;
  height: 44px;
  left: 31px;
  top: 31px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  pointer-events: none;
}

#ajustes {
  display: none;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
}

#estado {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 15px;
  border-radius: 8px;
  background: rgba(21,58,49,0.85);
  color: white;
  z-index: 20;
  display: none;
}

#boton-ar {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 30px;
}

</style>
</head>

<body>

<header>
  <h1>Museo de la Memoria</h1>
  <p>Tlaxcala, México</p>
</header>

<div class="controles">
  <button id="exterior">Vista exterior</button>
  <button id="recorrido">Recorrido virtual</button>
  <button id="reiniciar">Regresar al patio</button>
</div>

<div id="contenedor">

  <model-viewer
    id="maqueta"
    src="./museo.glb"
    alt="Modelo tridimensional del Museo de la Memoria"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <button slot="ar-button" id="boton-ar">
      Ver en mi espacio
    </button>

  </model-viewer>

  <div id="visor-recorrido"></div>

  <div id="estado">Cargando museo...</div>

  <div id="joystick">
    <div id="palanca"></div>
  </div>

</div>

<div id="ajustes">
  <button id="bajar">− Altura</button>
  <span id="altura">Altura: 6.00</span>
  <button id="subir">+ Altura</button>

  <label>
    Velocidad:
    <input id="velocidad"
      type="range"
      min="2"
      max="20"
      value="8"
      step="1">
  </label>
</div>

<div id="instrucciones">
  Explora la arquitectura del museo en 3D.
</div>

<script type="module">

import * as THREE from
  "https://esm.sh/three@0.170.0";

import { GLTFLoader } from
  "https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

import { DRACOLoader } from
  "https://esm.sh/three@0.170.0/examples/jsm/loaders/DRACOLoader.js";


// =====================================
// CONFIGURACIÓN INICIAL
// =====================================

const visor = document.getElementById("visor-recorrido");
const maqueta = document.getElementById("maqueta");
const joystick = document.getElementById("joystick");
const palanca = document.getElementById("palanca");
const estado = document.getElementById("estado");
const ajustes = document.getElementById("ajustes");

const patio = new THREE.Vector3(
  -139.85,
  6.00,
  50.16
);

let modoRecorrido = false;
let modeloCargado = false;
let modeloCargando = false;

let yaw = 0;
let pitch = 0;
let velocidad = 8;

let limites = null;


// =====================================
// ESCENA Y CÁMARA
// =====================================

const escena = new THREE.Scene();

escena.background = new THREE.Color(0xe9eee9);

const camara = new THREE.PerspectiveCamera(
  70,
  1,
  0.05,
  2000
);

camara.position.copy(patio);
camara.rotation.order = "YXZ";

const render = new THREE.WebGLRenderer({
  antialias: true
});

render.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

render.outputColorSpace = THREE.SRGBColorSpace;

render.toneMapping = THREE.ACESFilmicToneMapping;
render.toneMappingExposure = 1.1;

visor.appendChild(render.domElement);


// =====================================
// ILUMINACIÓN
// =====================================

const luzAmbiente = new THREE.HemisphereLight(
  0xffffff,
  0x777777,
  2
);

escena.add(luzAmbiente);

const luzSolar = new THREE.DirectionalLight(
  0xffffff,
  2
);

luzSolar.position.set(30, 100, 50);

escena.add(luzSolar);


// =====================================
// COMPRESIÓN DRACO
// =====================================

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();

loader.setDRACOLoader(dracoLoader);


// =====================================
// CARGAR MODELO
// =====================================

function cargarMuseo() {

  if (modeloCargado || modeloCargando) return;

  modeloCargando = true;
  estado.style.display = "block";
  estado.textContent = "Cargando recorrido virtual...";

  loader.load(

    "./museo.glb",

    gltf => {

      escena.add(gltf.scene);

      limites = new THREE.Box3()
        .setFromObject(gltf.scene);

      modeloCargado = true;
      modeloCargando = false;

      estado.style.display = "none";

      reiniciarCamara();

      console.log("Museo cargado correctamente");
      console.log("Limites:", limites);

    },

    progreso => {

      if (progreso.total > 0) {

        const porcentaje = Math.round(
          progreso.loaded / progreso.total * 100
        );

        estado.textContent =
          "Cargando museo: " + porcentaje + "%";

      }

    },

    error => {

      modeloCargando = false;

      estado.textContent =
        "No se pudo cargar el modelo. Intenta nuevamente.";

      console.error(error);

    }

  );

}


// =====================================
// ORIENTACIÓN DE CÁMARA
// =====================================

function orientarCamara() {

  camara.rotation.set(
    pitch,
    yaw,
    0,
    "YXZ"
  );

}

function reiniciarCamara() {

  camara.position.copy(patio);

  yaw = 0;
  pitch = 0;

  orientarCamara();
  actualizarAltura();

}


// =====================================
// MIRAR CON RATÓN O PANTALLA TÁCTIL
// =====================================

let arrastrando = false;
let punteroCamara = null;
let ultimoX = 0;
let ultimoY = 0;

render.domElement.addEventListener(
  "pointerdown",
  e => {

    if (!modoRecorrido || punteroCamara !== null) return;

    arrastrando = true;
    punteroCamara = e.pointerId;

    ultimoX = e.clientX;
    ultimoY = e.clientY;

    render.domElement.setPointerCapture(e.pointerId);

  }
);

render.domElement.addEventListener(
  "pointermove",
  e => {

    if (!arrastrando || e.pointerId !== punteroCamara) return;

    const dx = e.clientX - ultimoX;
    const dy = e.clientY - ultimoY;

    yaw -= dx * 0.003;
    pitch -= dy * 0.003;

    pitch = THREE.MathUtils.clamp(
      pitch,
      -Math.PI / 2 + 0.05,
      Math.PI / 2 - 0.05
    );

    ultimoX = e.clientX;
    ultimoY = e.clientY;

    orientarCamara();

  }
);

function soltarCamara(e) {

  if (e.pointerId !== punteroCamara) return;

  arrastrando = false;
  punteroCamara = null;

}

render.domElement.addEventListener(
  "pointerup", soltarCamara
);

render.domElement.addEventListener(
  "pointercancel", soltarCamara
);

render.domElement.addEventListener(
  "lostpointercapture", soltarCamara
);


// =====================================
// CONTROLES DE TECLADO
// =====================================

const teclas = {};

window.addEventListener("keydown", e => {

  if (!modoRecorrido) return;

  if (e.target instanceof HTMLInputElement) return;

  const tecla = e.key.toLowerCase();

  if ([
    "w", "a", "s", "d",
    "arrowup", "arrowdown",
    "arrowleft", "arrowright"
  ].includes(tecla)) {

    e.preventDefault();
    teclas[tecla] = true;

  }

});

window.addEventListener("keyup", e => {

  teclas[e.key.toLowerCase()] = false;

});

window.addEventListener("blur", () => {

  for (const tecla in teclas) {
    teclas[tecla] = false;
  }

  joyX = 0;
  joyY = 0;

  palanca.style.transform = "translate(0px, 0px)";

});


// =====================================
// JOYSTICK PARA TELÉFONOS
// =====================================

let joyX = 0;
let joyY = 0;
let punteroJoystick = null;

function moverJoystick(e) {

  const rect = joystick.getBoundingClientRect();

  let x = e.clientX - rect.left - rect.width / 2;
  let y = e.clientY - rect.top - rect.height / 2;

  const radio = 35;
  const distancia = Math.hypot(x, y);

  if (distancia > radio) {

    x *= radio / distancia;
    y *= radio / distancia;

  }

  joyX = x / radio;
  joyY = y / radio;

  palanca.style.transform =
    `translate(${x}px, ${y}px)`;

}

joystick.addEventListener("pointerdown", e => {

  if (punteroJoystick !== null) return;

  e.preventDefault();

  punteroJoystick = e.pointerId;

  joystick.setPointerCapture(e.pointerId);

  moverJoystick(e);

});

joystick.addEventListener("pointermove", e => {

  if (e.pointerId !== punteroJoystick) return;

  moverJoystick(e);

});

function soltarJoystick(e) {

  if (e.pointerId !== punteroJoystick) return;

  punteroJoystick = null;

  joyX = 0;
  joyY = 0;

  palanca.style.transform = "translate(0px, 0px)";

}

joystick.addEventListener(
  "pointerup", soltarJoystick
);

joystick.addEventListener(
  "pointercancel", soltarJoystick
);

joystick.addEventListener(
  "lostpointercapture", soltarJoystick
);


// =====================================
// MOVIMIENTO EN PRIMERA PERSONA
// =====================================

const reloj = new THREE.Clock();

const adelante = new THREE.Vector3();
const derecha = new THREE.Vector3();
const movimiento = new THREE.Vector3();

function actualizarMovimiento(delta) {

  let avance = -joyY;
  let lateral = joyX;

  if (teclas["w"] || teclas["arrowup"]) {
    avance += 1;
  }

  if (teclas["s"] || teclas["arrowdown"]) {
    avance -= 1;
  }

  if (teclas["a"] || teclas["arrowleft"]) {
    lateral -= 1;
  }

  if (teclas["d"] || teclas["arrowright"]) {
    lateral += 1;
  }

  adelante.set(
    -Math.sin(yaw),
    0,
    -Math.cos(yaw)
  );

  derecha.set(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );

  movimiento.set(0, 0, 0);

  movimiento.addScaledVector(adelante, avance);
  movimiento.addScaledVector(derecha, lateral);

  if (movimiento.length() > 1) {
    movimiento.normalize();
  }

  camara.position.addScaledVector(
    movimiento,
    velocidad * delta
  );

  // Evita salir de los límites generales del modelo.

  if (limites) {

    camara.position.x = THREE.MathUtils.clamp(
      camara.position.x,
      limites.min.x,
      limites.max.x
    );

    camara.position.z = THREE.MathUtils.clamp(
      camara.position.z,
      limites.min.z,
      limites.max.z
    );

  }

}


// =====================================
// AJUSTAR ALTURA Y VELOCIDAD
// =====================================

function actualizarAltura() {

  document.getElementById("altura").textContent =
    "Altura: " + camara.position.y.toFixed(2);

}

function cambiarAltura(cantidad) {

  camara.position.y += cantidad;

  if (limites) {

    camara.position.y = THREE.MathUtils.clamp(
      camara.position.y,
      limites.min.y + 0.1,
      limites.max.y
    );

  }

  actualizarAltura();

}

document.getElementById("subir").onclick = () => {
  cambiarAltura(0.5);
};

document.getElementById("bajar").onclick = () => {
  cambiarAltura(-0.5);
};

document.getElementById("velocidad")
  .addEventListener("input", e => {

    velocidad = Number(e.target.value);

  });


// =====================================
// CAMBIAR ENTRE VISTAS
// =====================================

function mostrarExterior() {

  modoRecorrido = false;

  maqueta.style.display = "block";
  visor.style.display = "none";
  joystick.style.display = "none";
  ajustes.style.display = "none";
  estado.style.display = "none";

  for (const tecla in teclas) {
    teclas[tecla] = false;
  }

  joyX = 0;
  joyY = 0;

  document.getElementById("instrucciones")
    .textContent =
    "Gira la maqueta o visualízala en realidad aumentada.";

}

function mostrarRecorrido() {

  modoRecorrido = true;

  maqueta.style.display = "none";
  visor.style.display = "block";
  joystick.style.display = "block";
  ajustes.style.display = "flex";

  document.getElementById("instrucciones")
    .textContent =
    "Usa WASD, las flechas o el joystick para desplazarte. Arrastra la pantalla para mirar.";

  ajustarPantalla();

  cargarMuseo();

  if (modeloCargando) {
    estado.style.display = "block";
  }

}

document.getElementById("exterior").onclick =
  mostrarExterior;

document.getElementById("recorrido").onclick =
  mostrarRecorrido;

document.getElementById("reiniciar").onclick = () => {

  mostrarRecorrido();
  reiniciarCamara();

};


// =====================================
// AJUSTAR TAMAÑO DE PANTALLA
// =====================================

function ajustarPantalla() {

  const ancho = visor.clientWidth;
  const alto = visor.clientHeight;

  if (ancho === 0 || alto === 0) return;

  camara.aspect = ancho / alto;

  camara.updateProjectionMatrix();

  render.setSize(ancho, alto);

}

window.addEventListener(
  "resize",
  ajustarPantalla
);

new ResizeObserver(ajustarPantalla)
  .observe(visor);


// =====================================
// ANIMACIÓN
// =====================================

function animar() {

  requestAnimationFrame(animar);

  const delta = Math.min(
    reloj.getDelta(),
    0.05
  );

  if (modoRecorrido && modeloCargado) {

    actualizarMovimiento(delta);

    render.render(escena, camara);

  }

}

animar();

mostrarExterior();

</script>

</body>
</html>
