
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Museo de la Memoria | RA</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f4ef;
      color: #173b32;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 24px 16px 8px; }
    h1 { font-size: 25px; }
    model-viewer {
      width: 100%;
      height: 65vh;
      background: #e9eee9;
    }
    .info { padding: 16px; }
    button[slot="ar-button"] {
      background: #173b32;
      color: white;
      border: 0;
      border-radius: 30px;
      padding: 14px 22px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Museo de la Memoria</h1>
    <p>Tlaxcala, México</p>
  </header>

  <model-viewer
    src="./museo.glb"
    alt="Maqueta 3D del Museo de la Memoria"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    shadow-intensity="1"
    exposure="1">

    <button slot="ar-button">
      Ver en mi espacio
    </button>

  </model-viewer>

  <div class="info">
    <p>Explora la arquitectura del museo en 3D.</p>
    <p>Gira el modelo o actívalo en
       realidad aumentada.</p>
  </div>
</body>
</html>
