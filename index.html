
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Museo de la Memoria | RA</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f4ef;
      color: #173b32;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 24px 16px 8px; }
    h1 { font-size: 25px; }
    model-viewer {
      width: 100%;
      height: 65vh;
      background: #e9eee9;
    }
    .info { padding: 16px; }
    button[slot="ar-button"] {
      background: #173b32;
      color: white;
      border: 0;
      border-radius: 30px;
      padding: 14px 22px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
    }


.controles {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 20px;
}

.controles button {
  background: #173b32;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 14px 20px;
  font-size: 15px;
  cursor: pointer;
}

.controles button:hover {
  background: #286a55;
}

  </style>

</head>

<script type="module">
import * as THREE from
  "https://esm.sh/three@0.170.0";

import { GLTFLoader } from
  "https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

const contenedor = document.getElementById("visor-patio");

const escena = new THREE.Scene();
escena.background = new THREE.Color(0xe9eee9);

const camara = new THREE.PerspectiveCamera(
  75, 1, 0.05, 2000
);

const render = new THREE.WebGLRenderer({
  antialias: true
});

render.setPixelRatio(Math.min(devicePixelRatio, 2));
contenedor.appendChild(render.domElement);

escena.add(new THREE.HemisphereLight(0xffffff, 0x888888, 3));

const luz = new THREE.DirectionalLight(0xffffff, 2);
luz.position.set(30, 80, 20);
escena.add(luz);

// Coordenadas provisionales del patio.
// Deben comprobarse contra el GLB exportado.
const patio = new THREE.Vector3(-130, 37.64, 52.5);

camara.position.copy(patio);

let yaw = 0;
let pitch = 0;
let arrastrando = false;
let ultimoX = 0;
let ultimoY = 0;

function orientarCamara() {
  camara.rotation.order = "YXZ";
  camara.rotation.y = yaw;
  camara.rotation.x = pitch;
}

render.domElement.style.touchAction = "none";

render.domElement.addEventListener("pointerdown", e => {
  arrastrando = true;
  ultimoX = e.clientX;
  ultimoY = e.clientY;
  render.domElement.setPointerCapture(e.pointerId);
});

render.domElement.addEventListener("pointermove", e => {
  if (!arrastrando) return;

  yaw -= (e.clientX - ultimoX) * 0.005;
  pitch -= (e.clientY - ultimoY) * 0.005;

  pitch = THREE.MathUtils.clamp(
    pitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05
  );

  ultimoX = e.clientX;
  ultimoY = e.clientY;
  orientarCamara();
});

render.domElement.addEventListener("pointerup", () => {
  arrastrando = false;
});

render.domElement.addEventListener("pointercancel", () => {
  arrastrando = false;
});


new GLTFLoader().load(
  "./museo.glb",

  gltf => {
    escena.add(gltf.scene);

    console.log("Museo cargado en Three.js");

    const caja = new THREE.Box3()
      .setFromObject(gltf.scene);

    const centro = caja.getCenter(
      new THREE.Vector3()
    );

    console.log("Centro del modelo:", centro);
    console.log("Dimensiones:", caja.getSize(
      new THREE.Vector3()
    ));

    // Cámara de prueba: observar el modelo completo
    const dimensiones = caja.getSize(
      new THREE.Vector3()
    );

    camara.position.set(
      centro.x,
      centro.y + dimensiones.y * 0.5,
      centro.z + Math.max(
        dimensiones.x,
        dimensiones.y,
        dimensiones.z
      ) * 1.5
    );

    camara.lookAt(centro);
  },

  undefined,

  error => {
    console.error("Error cargando GLB:", error);
    alert("No se pudo cargar el modelo 3D");
  }
);

function ajustarTamano() {
  const ancho = contenedor.clientWidth;
  const alto = contenedor.clientHeight;
  if (!ancho || !alto) return;

  camara.aspect = ancho / alto;
  camara.updateProjectionMatrix();
  render.setSize(ancho, alto);
}

window.mostrarPatio = function() {
  document.querySelector("model-viewer").style.display = "none";
  contenedor.style.display = "block";
  ajustarTamano();
};

window.mostrarExterior = function() {
  contenedor.style.display = "none";
  document.querySelector("model-viewer").style.display = "block";
};

window.addEventListener("resize", ajustarTamano);

function animar() {
  requestAnimationFrame(animar);
  if (contenedor.style.display !== "none") {
    render.render(escena, camara);
  }
}
animar();
</script>

<body>
  <header>
    <h1>Museo de la Memoria</h1>
    <p>Tlaxcala, México</p>
  </header>

  <model-viewer
    src="./museo.glb"
    alt="Maqueta 3D del Museo de la Memoria"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    shadow-intensity="1"
    exposure="1">


<div class="controles">
  <button onclick="mostrarExterior()">
    Vista exterior
  </button>

  <button onclick="mostrarPatio()">
    Explorar patio central
  </button>
</div>

  <button slot="ar-button">
    Ver en mi espacio
  </button>

</model-viewer>

<div id="visor-patio"
     style="display:none; width:100%; height:65vh;">
</div>


    <button slot="ar-button">
      Ver en mi espacio
    </button>

  </model-viewer>


<script>
  const modelo = document.querySelector("model-viewer");

  function vistaExterior() {
    modelo.cameraTarget = "auto";
    modelo.cameraOrbit = "45deg 65deg auto";
    modelo.fieldOfView = "30deg";
  }

  


function vistaPatio() {
  modelo.autoRotate = false;

  // Permitir acercarse al interior
  modelo.minCameraOrbit = "auto auto 0.1m";

  // Permitir una vista amplia
  modelo.maxFieldOfView = "90deg";

  // Punto del patio (provisional)
  modelo.cameraTarget = "-130m 36.04m 52.5m";

  // Cámara cercana al punto seleccionado
  modelo.cameraOrbit = "180deg 90deg 1.5m";

  modelo.fieldOfView = "75deg";
}

</script>


  <div class="info">
    <p>Explora la arquitectura del museo en 3D.</p>
    <p>Gira el modelo o actívalo en
       realidad aumentada.</p>
  </div>
</body>
</html>
