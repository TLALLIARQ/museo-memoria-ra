
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Museo de la Memoria | RA</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f4ef;
      color: #173b32;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 24px 16px 8px; }
    h1 { font-size: 25px; }
    model-viewer {
      width: 100%;
      height: 65vh;
      background: #e9eee9;
    }
    .info { padding: 16px; }
    button[slot="ar-button"] {
      background: #173b32;
      color: white;
      border: 0;
      border-radius: 30px;
      padding: 14px 22px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
    }


.controles {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 20px;
}

.controles button {
  background: #173b32;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 14px 20px;
  font-size: 15px;
  cursor: pointer;
}

.controles button:hover {
  background: #286a55;
}

  </style>

</head>

<body>
  <header>
    <h1>Museo de la Memoria</h1>
    <p>Tlaxcala, México</p>
  </header>

  <model-viewer
    src="./museo.glb"
    alt="Maqueta 3D del Museo de la Memoria"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    shadow-intensity="1"
    exposure="1">

<div class="controles">
  <button onclick="vistaExterior()">
    Vista exterior
  </button>

  <button onclick="vistaPatio()">
    Explorar patio central
  </button>
</div>

 <div slot="poster">
    Cargando maqueta del museo...
  </div>

  <button slot="ar-button">
    Ver en mi espacio
  </button>

</model-viewer>

    <button slot="ar-button">
      Ver en mi espacio
    </button>

  </model-viewer>


<script>
  const modelo = document.querySelector("model-viewer");

  function vistaExterior() {
    modelo.cameraTarget = "auto";
    modelo.cameraOrbit = "45deg 65deg auto";
    modelo.fieldOfView = "30deg";
  }

  

function vistaPatio() {
  modelo.autoRotate = false;

  modelo.cameraTarget = "-130m 36.04m 52.5m";
  modelo.cameraOrbit = "180deg 90deg 3m";
  modelo.fieldOfView = "75deg";
}

</script>


  <div class="info">
    <p>Explora la arquitectura del museo en 3D.</p>
    <p>Gira el modelo o actívalo en
       realidad aumentada.</p>
  </div>
</body>
</html>
